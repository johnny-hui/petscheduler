# Application Metadata
spring.application.name=petscheduler

# Server Settings
server.port=6969

# [JPA] - Database Connection (DB created using script provided)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# [JPA] - Hibernate Settings (for database initialization)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configs
jwt.private.key.path=${JWT_PVT_KEY_PATH}
jwt.public.key.path=${JWT_PUB_KEY_PATH}
jwt.access.expiration.time=3600000
jwt.refresh.expiration.time=604800000

# Logging Configs
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.security=debug